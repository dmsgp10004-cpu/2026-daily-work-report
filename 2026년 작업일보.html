<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 작업일보</title>
<style>
:root{
  --bg:#f4f5f7; --paper:#fff; --ink:#1d2129; --muted:#6b7280; --line:#c9ced6; --line-strong:#4b5563;
  --head:#eef1f5; --accent:#1f5fae; --accent-soft:#e6eefa; --warn:#b42318;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --paper:#1e2228; --ink:#e6e8eb; --muted:#9aa3ae; --line:#3a414b; --line-strong:#8b95a3;
    --head:#262b33; --accent:#7fb0f0; --accent-soft:#22324a; --warn:#f08c80;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --paper:#1e2228; --ink:#e6e8eb; --muted:#9aa3ae; --line:#3a414b; --line-strong:#8b95a3;
  --head:#262b33; --accent:#7fb0f0; --accent-soft:#22324a; --warn:#f08c80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
header.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header.bar h1{font-size:16px;margin:0 12px 0 0}
.tabs{display:flex;gap:4px}
button,select,input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.spacer{flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.nav .count{color:var(--muted);font-size:13px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px 32px;margin-bottom:16px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.doc-title{font-size:26px;font-weight:700;letter-spacing:.3em;text-decoration:underline;text-underline-offset:6px;margin:8px 0 0}
table.sign{border-collapse:collapse}
table.sign td{border:1px solid var(--line-strong);width:84px;text-align:center;padding:4px}
table.sign tr:last-child td{height:56px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin:20px 0 6px;font-size:15px}
.meta b{font-weight:600}
.meta .sub{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;min-width:640px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border:1px solid var(--line-strong);padding:7px 4px;text-align:center}
table.grid th{background:var(--head);font-weight:600}
table.grid td.num{font-size:15px}
table.grid th.side{width:44px;line-height:1.35}
table.grid + table.grid{border-top:none}
.notes td{text-align:left!important;padding:8px 12px!important}
.zero{color:var(--muted)}
/* summary */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
table.sum{width:100%;border-collapse:collapse;background:var(--paper);font-variant-numeric:tabular-nums;min-width:820px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
table.sum th{position:sticky;top:0;background:var(--head);text-align:center;font-weight:600}
table.sum td.l{text-align:left}
table.sum tbody tr{cursor:pointer}
table.sum tbody tr:hover{background:var(--accent-soft)}
table.sum tfoot td{font-weight:700;border-top:2px solid var(--line-strong)}
.flag{color:var(--warn)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
#printAll{display:none}
@media (max-width:600px){
  .paper{padding:18px 14px}
  .doc-title{font-size:20px}
}
@media print{
  body{background:#fff;color:#000}
  header.bar,.nav,.filters,#viewSummary,.legend{display:none!important}
  main{max-width:none;padding:0}
  .paper{border:none;padding:0;margin:0;page-break-after:always}
  body.print-all #viewDaily{display:none}
  body.print-all #printAll{display:block}
  table.grid th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="bar">
  <h1>2026년 위험물 작업일보</h1>
  <div class="tabs">
    <button id="tabDaily" class="on">일보</button>
    <button id="tabSummary">전체 요약</button>
  </div>
  <span class="spacer"></span>
  <button id="btnPrint" title="현재 일보 인쇄">인쇄</button>
  <button id="btnPrintAll" title="전체 일보를 한 장씩 인쇄">전체 인쇄</button>
  <button id="btnTheme" title="밝게/어둡게">테마</button>
</header>
<main>
  <section id="viewDaily">
    <div class="nav">
      <button id="prev">◀ 이전</button>
      <select id="sel"></select>
      <button id="next">다음 ▶</button>
      <input type="date" id="jump" min="2026-01-01" max="2026-12-31" title="날짜로 이동">
      <span class="count" id="count"></span>
    </div>
    <div id="sheet"></div>
  </section>
  <section id="viewSummary" hidden>
    <div class="filters">
      <select id="month"></select>
      <input id="q" placeholder="선명 검색" size="16">
      <span class="count" id="sumCount"></span>
    </div>
    <div class="scroll">
      <table class="sum">
        <thead>
          <tr><th>시트</th><th>일시</th><th>선명</th><th>수입</th><th>수출</th><th>본선 Total</th><th>전일재고</th><th>반입</th><th>반출</th><th>금일재고</th></tr>
        </thead>
        <tbody id="sumBody"></tbody>
        <tfoot id="sumFoot"></tfoot>
      </table>
    </div>
    <p class="legend">수입·수출·본선 Total은 주간+야간, 20'+40' 합계(VAN). <span class="flag">빨간색</span> 전일재고는 전날 시트의 금일재고와 다른 값입니다(원본 그대로 표시). 행을 누르면 해당 일보로 이동합니다.</p>
  </section>
  <div id="printAll"></div>
</main>

  d.imp = n(d.day[0]) + n(d.day[1]) + n(d.night[0]) + n(d.night[1]);
  d.exp = n(d.day[2]) + n(d.day[3]) + n(d.night[2]) + n(d.night[3]);
  d.tot = n(d.day[8]) + n(d.day[9]) + n(d.night[8]) + n(d.night[9]);
  d.carryBad = i > 0 && d.stock[0] !== DATA[i-1].stock[7];
});

function render(d){
  const row = (label, v) => `<tr><th class="side">${label}</th>${v.map(x => `<td class="num">${cell(x)}</td>`).join('')}</tr>`;
  const s = d.stock;
  return `<article class="paper">
    <div class="title-row">
      <div class="doc-title">위험물 작업일보</div>
      <table class="sign"><tr><td>담 당</td><td>팀 장</td></tr><tr><td></td><td></td></tr></table>
    </div>
    <div class="meta"><span><b>${esc(d.date)}</b></span><span class="sub">(재고 기준 : 당일 08시)</span></div>
    <div class="meta" style="margin-top:0"><span>${esc(d.vessel)}</span><span class="sub">단위 : VAN</span></div>
    <div class="scroll">
    <table class="grid">
      <tr><th class="side" rowspan="4">본<br>선<br><br>작<br>업</th><th class="side" rowspan="2">구분</th>
        <th colspan="2">수입</th><th colspan="2">수출</th><th colspan="2">Shifting</th><th colspan="2">Other</th><th colspan="2">Total</th></tr>
      <tr>${"<th>20'</th><th>40'</th>".repeat(5)}</tr>
      ${row('주간', d.day).replace('<tr>', '<tr>')}
      ${row('야간', d.night)}
    </table>
    <table class="grid">
      <tr><th class="side" rowspan="3">상<br>하<br>차<br><br>작<br>업</th>
        <th rowspan="2">전일재고</th><th colspan="3">반 입<br><small>(전일 8시 ~ 익일 8시)</small></th>
        <th colspan="3">반 출<br><small>(전일 8시 ~ 익일 8시)</small></th><th rowspan="2">금일재고</th><th rowspan="2">비고</th></tr>
      <tr><th>양하</th><th>Gate-In</th><th>Total</th><th>적하</th><th>GateOut</th><th>Total</th></tr>
      <tr>${s.map(x => `<td class="num">${cell(x)}</td>`).join('')}<td>${esc(d.remark)}</td></tr>
    </table>
    <table class="grid notes">
      ${d.notes.map((t, i) => `<tr>${i === 0 ? `<th class="side" rowspan="${d.notes.length}">특<br>기<br>사<br>항</th>` : ''}<td>${esc(t)}</td></tr>`).join('')}
    </table>
    </div>
  </article>`;
}

// daily view
let cur = DATA.length - 1;
$('sel').innerHTML = DATA.map((d, i) => `<option value="${i}">${d.mm}월 ${d.dd}일 — ${esc(d.vessel.replace(/^선\s*명\s*:\s*/, ''))}</option>`).join('');
function show(i){
  cur = Math.max(0, Math.min(DATA.length - 1, i));
  const d = DATA[cur];
  $('sheet').innerHTML = render(d);
  $('sel').value = cur;
  $('jump').value = d.iso;
  $('count').textContent = `${cur + 1} / ${DATA.length} (시트: ${d.sheet})`;
  $('prev').disabled = cur === 0; $('next').disabled = cur === DATA.length - 1;
  history.replaceState(null, '', '#' + encodeURIComponent(d.sheet));
}
$('prev').onclick = () => show(cur - 1);
$('next').onclick = () => show(cur + 1);
$('sel').onchange = e => show(+e.target.value);
$('jump').onchange = e => {
  const v = e.target.value; if (!v) return;
  let i = DATA.findIndex(d => d.iso === v);
  if (i < 0) { i = DATA.findIndex(d => d.iso > v); if (i < 0) i = DATA.length - 1; }
  show(i);
};
document.addEventListener('keydown', e => {
  if (!$('viewDaily').hidden && !/INPUT|SELECT/.test(e.target.tagName)) {
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  }
});

// summary view
const months = [...new Set(DATA.map(d => d.mm))];
$('month').innerHTML = '<option value="0">전체 월</option>' + months.map(m => `<option value="${m}">${m}월</option>`).join('');
function renderSum(){
  const m = +$('month').value, q = $('q').value.trim().toLowerCase();
  const rows = DATA.filter(d => (!m || d.mm === m) && (!q || d.vessel.toLowerCase().includes(q)));
  $('sumBody').innerHTML = rows.map(d => `<tr data-i="${d.idx}">
    <td class="l">${esc(d.sheet)}</td><td class="l">${esc(d.date.replace(/^일\s*시\s*:\s*/, ''))}</td>
    <td class="l">${esc(d.vessel.replace(/^선\s*명\s*:\s*/, ''))}</td>
    <td>${fmt(d.imp)}</td><td>${fmt(d.exp)}</td><td>${fmt(d.tot)}</td>
    <td class="${d.carryBad ? 'flag' : ''}">${cell(d.stock[0])}</td><td>${cell(d.stock[3])}</td><td>${cell(d.stock[6])}</td><td>${cell(d.stock[7])}</td></tr>`).join('');
  const sum = k => rows.reduce((a, d) => a + k(d), 0);
  $('sumFoot').innerHTML = `<tr><td class="l" colspan="3">합계 (${rows.length}일)</td>
    <td>${fmt(sum(d => d.imp))}</td><td>${fmt(sum(d => d.exp))}</td><td>${fmt(sum(d => d.tot))}</td>
    <td></td><td>${fmt(sum(d => n(d.stock[3])))}</td><td>${fmt(sum(d => n(d.stock[6])))}</td><td></td></tr>`;
  $('sumCount').textContent = `${rows.length}일`;
}
$('month').onchange = renderSum; $('q').oninput = renderSum;
$('sumBody').onclick = e => { const tr = e.target.closest('tr'); if (tr) { setTab('daily'); show(+tr.dataset.i); } };

function setTab(t){
  $('viewDaily').hidden = t !== 'daily'; $('viewSummary').hidden = t === 'daily';
  $('tabDaily').classList.toggle('on', t === 'daily'); $('tabSummary').classList.toggle('on', t !== 'daily');
}
$('tabDaily').onclick = () => setTab('daily');
$('tabSummary').onclick = () => setTab('summary');

$('btnPrint').onclick = () => { setTab('daily'); window.print(); };
$('btnPrintAll').onclick = () => {
  $('printAll').innerHTML = DATA.map(render).join('');
  document.body.classList.add('print-all');
  window.print();
};
window.addEventListener('afterprint', () => { document.body.classList.remove('print-all'); $('printAll').innerHTML = ''; });

$('btnTheme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

renderSum();
const h = decodeURIComponent(location.hash.slice(1));
const hi = DATA.findIndex(d => d.sheet === h);
show(hi >= 0 ? hi : DATA.length - 1);
</script>
</body>
</html>
